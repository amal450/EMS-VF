<!-- Style pour cacher la scrollbar -->
<style>
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>

<aside class="w-[220px] bg-[#0b1224] h-screen flex flex-col shadow-2xl border-r border-white/5 relative text-white font-sans transition-all duration-300">
  
  <!-- LOGO -->
  <div class="p-6 pb-8">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-cyan-500/20 flex items-center justify-center text-cyan-400 border border-cyan-500/30 shadow-lg">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      </div>
      <h1 class="text-lg font-black tracking-tight uppercase leading-none">EMS <span class="text-cyan-400 font-light">Volt</span></h1>
    </div>
  </div>

  <!-- MENU DE NAVIGATION -->
  <nav class="flex-1 px-3 space-y-6 overflow-y-auto hide-scrollbar pb-10">
    
    <!-- SECTION SUIVI -->
    <div>
      <p class="px-3 text-[9px] font-black text-slate-500 uppercase tracking-widest mb-3">{{ languageService.translate('tracking') }}</p>
      <div class="space-y-0.5">
        <button (click)="navigateTo('dashboard')" 
                [class]="activeButton() === 'overview' ? 'bg-cyan-500/10 text-cyan-400 border-r-2 border-cyan-500 shadow-[inset_0_0_10px_rgba(6,182,212,0.05)]' : 'text-slate-400 hover:bg-white/5'"
                class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg font-bold text-[14px] transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          {{ languageService.translate('overview') }}
        </button>

        <button (click)="navigateTo('hierarchy')" 
                [class]="activeButton() === 'hierarchy' ? 'bg-cyan-500/10 text-cyan-400 border-r-2 border-cyan-500' : 'text-slate-400 hover:bg-white/5'"
                class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg font-bold text-[14px] transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          {{ languageService.translate('asset') }}
        </button>

        <button *ngIf="authService.isAdmin()" (click)="navigateTo('users')" 
                [class]="activeButton() === 'users' ? 'bg-cyan-500/10 text-cyan-400 border-r-2 border-cyan-500' : 'text-slate-400 hover:bg-white/5'"
                class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg font-bold text-[14px] transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          {{ languageService.translate('usersManagement') }}
        </button>
      </div>
    </div>

    <!-- SECTION ANALYTIQUE -->
    <div>
      <p class="px-3 text-[9px] font-black text-slate-500 uppercase tracking-widest mb-3">{{ languageService.translate('analytics') }}</p>
      <div class="space-y-0.5">
        <button *ngIf="authService.hasPermission('VIEW_ALERTS')" (click)="navigateTo('alerts')" [class]="activeButton()==='alerts'?'bg-cyan-500/10 text-cyan-400 border-r-2 border-cyan-500':'text-slate-400'" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg font-bold text-[14px]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          {{ languageService.translate('alerts') }}
        </button>
        <button *ngIf="authService.hasPermission('VIEW_REPORTS')" (click)="navigateTo('reports')" [class]="activeButton()==='reports'?'bg-cyan-500/10 text-cyan-400 border-r-2 border-cyan-500':'text-slate-400'" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg font-bold text-[14px]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          {{ languageService.translate('reports') }}
        </button>
        <button *ngIf="authService.hasPermission('VIEW_INVOICES')" (click)="navigateTo('billing')" [class]="activeButton()==='billing'?'bg-cyan-500/10 text-cyan-400 border-r-2 border-cyan-500':'text-slate-400'" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg font-bold text-[14px]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
          {{ languageService.translate('billing') }}
        </button>
      </div>
    </div>

    <div>
      <p class="px-3 text-[9px] font-black text-slate-500 uppercase tracking-widest mb-3">{{ languageService.translate('account') }}</p>
      <button (click)="navigateTo('profile')" [class]="activeButton()==='profile'?'bg-cyan-500/10 text-cyan-400 border-r-2 border-cyan-500':'text-slate-400'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg font-bold text-[14px]">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        {{ languageService.translate('profile') }}
      </button>
    </div>
  </nav>

  <!-- BOUTON DÉCONNEXION -->
  <div class="p-4 border-t border-white/5 bg-black/20">
    <button (click)="askLogout()" class="w-full flex items-center gap-3 px-3 py-2 text-red-400/80 hover:text-red-400 transition-all font-black text-[14px]">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      {{ languageService.translate('logout') }}
    </button>
  </div>

  <!-- MODAL DE CONFIRMATION (BLANC TRANSPARENT FLOTTANT) -->
  <div *ngIf="showLogoutModal()" class="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900/40 backdrop-blur-md">
    <div class="bg-white/80 backdrop-blur-xl p-10 rounded-[2.5rem] w-96 text-center shadow-[0_0_50px_rgba(0,0,0,0.1)] border border-white animate-in zoom-in duration-200">
      
      <div class="w-20 h-20 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl font-bold border-2 border-red-100 shadow-[0_0_15px_rgba(239,68,68,0.2)]">?</div>
      <h3 class="text-2xl font-black text-slate-900 mb-2 tracking-tight">{{ languageService.translate('logoutConfirmTitle') }}</h3>
      <p class="text-sm text-slate-500 font-medium mb-10 px-4">{{ languageService.translate('logoutConfirmBody') }}</p>
      
      <div class="flex gap-4">
        <button (click)="cancelLogout()" class="flex-1 py-4 bg-slate-100/50 text-slate-500 border border-slate-200 rounded-2xl font-bold hover:bg-slate-100 transition-all text-sm">{{ languageService.translate('cancel') }}</button>
        <button (click)="confirmLogout()" class="flex-1 py-4 bg-red-500 text-white rounded-2xl font-black shadow-lg shadow-red-500/30 hover:bg-red-600 transition-all text-sm uppercase">{{ languageService.translate('exit') }}</button>
      </div>
    </div>
  </div>

</aside>
